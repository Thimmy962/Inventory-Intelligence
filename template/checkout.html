{{ define "title" }} Checkout {{ end }}
{{ define "content"}}
<div class="pt-20 flex-1 flex overflow-hidden">
    <!-- Left Panel: Product Search & Scanner -->
    <section class="flex-1 flex flex-col p-10 bg-surface overflow-y-auto no-scrollbar">
    <!-- Search/Scanner Interface -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 mb-12">
            <div class="md:col-span-8 relative group">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-emerald-700 group-focus-within:text-primary transition-colors" data-icon="search">search</span>
                <input id="searchInput" autofocus=""  oninput="queryServer(this.value)"
                class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-xl 
                text-sm focus:ring-2 focus:ring-primary transition-all outline-none" placeholder="Search product name, SKU or brand..." type="text"/>
               <div id="searchOverlay"class="absolute left-0 top-full mt-2 w-full bg-white border border-gray-200 
                    rounded-xl shadow-lg hidden z-50 max-h-80 overflow-y-auto"
                ></div>
            </div>
        </div>
    <!-- Quick Selection -->
        <div class="flex flex-col gap-6">
        <!-- Product Grid -->
            <div id="displayTop" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
            </div>
        </div>
    </section>
<!-- Right Panel: Cart/Order Summary -->
    <section class="w-full max-w-md bg-white flex flex-col h-full border-l border-emerald-100/20 shadow-[-4px_0_24px_rgba(0,0,0,0.02)]">
        <div class="p-8 border-b border-emerald-100/20 flex justify-between items-end">
            <div>
                <h3 class="text-2xl font-black text-emerald-900 font-headline">Current Order</h3>
            </div>
            <!-- <button id="clear_all" class="text-error font-bold text-xs hover:underline uppercase tracking-widest">Clear All</button> -->
             <button id="clear_all" onclick="clear_all_items()" class="text-error font-bold text-xs uppercase tracking-widest hover:underline disabled:text-gray-400 
             disabled:opacity-50 disabled:cursor-not-allowed disabled:no-underline">Clear All</button>
        </div>
        <div class="px-8 py-4 bg-slate-50 border-b border-emerald-100/20">
            <button class="flex items-center gap-2 text-primary font-bold text-sm hover:bg-emerald-100/50 px-3 py-2 rounded-lg transition-colors">
            <span class="material-symbols-outlined text-lg" data-icon="add_circle">add_circle</span>
                                Add Custom Item
                            </button>
        </div>
    <!-- Items List -->
    <div id="cartItems" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar bg-slate-50/30">
    <!-- Cart Item -->

    </div>
    <!-- Checkout Summary Section -->
        <div class="p-8 bg-white border-t border-emerald-100/20">
            <div class="space-y-3 mb-8">
                <div class="flex justify-between items-end pt-4 border-t border-slate-50">
                    <span class="text-emerald-900 font-bold text-lg">Total Amount</span>
                    <span id="total_amount" class="text-3xl font-black text-emerald-900 leading-none"></span>
                </div>
            </div>
            <button id="complete_sale" class="w-full py-5 bg-primary text-on-primary rounded-xl font-black text-xl flex items-center justify-center gap-3 shadow-lg shadow-primary/20 transition-all active:scale-[0.98] 
                hover:bg-primary-container 
                disabled:bg-gray-400 
                disabled:text-gray-200 
                disabled:shadow-none 
                disabled:cursor-not-allowed 
                disabled:opacity-70 
                disabled:pointer-events-none" onclick="submitCart()"> Complete Sale
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span></button>
        </div>
    </section>
</div>
<script>
         // Add this part
    var cart = [];
    document.addEventListener("DOMContentLoaded", function () {
        var clear_all = document.getElementById("clear_all");
        var complete_sale = document.getElementById("complete_sale")
        if (clear_all && complete_sale) {
            clear_all.disabled = cart.length < 1;
            complete_sale.disabled = cart.length < 1;
        }
    });
        

    function clear_all_items() {
        cart.length = 0
        renderCart()
    }

        
    let typingTimer; 
    const doneTypingInterval = 1000; // 500ms pause

    // search for product to select  for manipulation not add to cart 
    function queryServer(value) {
        clearTimeout(typingTimer);

        if (value.length < 3) {
            // if there is an overlay clear it
            if(!overlay.classList.contains("hidden")) {
                clearOverlay();
            }
            return;
        };

        typingTimer = setTimeout(() => {
            executeSearch(value);
        }, doneTypingInterval);
    }

    function executeSearch(value) {
        if (value.length > 3) {
            fetch(`/search?search=${value}`)
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(data => {
                    renderResults(data);
                })
                .catch(error => {
                    console.error("There was an error with the request:", error.message);
                    clearOverlay();
                });
        }
    }

    const overlay = document.getElementById("searchOverlay");
    const input = document.getElementById("searchInput");
    const total_amount = document.getElementById("total_amount")

    function clearOverlay() {
        overlay.innerHTML = "";
        overlay.classList.add("hidden");
    }

    function renderResults(results) {
        overlay.innerHTML = "";

        if (!results || results.length === 0) {
            clearOverlay();
            return;
        }

        results.forEach(item => {
            const el = document.createElement("div");

            el.className = `
                px-4 py-3 hover:bg-gray-100 cursor-pointer 
                flex justify-between items-center border-b last:border-none
            `;

            el.innerHTML = `
                <div>
                    <p class="font-medium text-gray-800">${item.ProductName}</p>
                    <p class="text-sm text-gray-500">Stock</p>
                </div>
                <div class="text-right">
                    <p class="text-green-700 font-semibold">₦${item.Price}</p>
                    <p class="text-xs text-green-600">${item.QuantityOnHand}</p>
                </div>
            `;

            el.addEventListener("click", () => {
                input.value = ""
                addToCart(item)
                clearOverlay();
            });
                overlay.appendChild(el);
            });
            overlay.classList.remove("hidden");
    }

        function addToCart(item) {
            const existing = cart.find(p => p.pid === item.ID);

            if (!existing) {
                cart.push({
                    pid: item.ID,
                    name: item.ProductName,
                    price: item.Price,
                    qty: 1
                });
            renderCart();
            }
        }

        function renderCart() {
            clear_all.disabled = cart.length < 1;
            complete_sale.disabled = cart.length < 1;

            const container = document.getElementById("cartItems");
            container.innerHTML = ""

            let total = 0;

            cart.forEach((item, index) => {

                const row = document.createElement("div");

                row.className = "bg-white p-5 rounded-xl flex items-center gap-4 transition-all \
                        hover:shadow-md border border-emerald-100/10";
                    itemTotal = item.price * item.qty
                row.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-on-surface truncate">${item.name}</p>
                        <p class="text-xs text-slate-500 font-medium mt-0.5">₦${item.price.toLocaleString()} / unit</p>
                    </div>
                    <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-lg">
                        <button onclick="manipulate(${index})" class="w-7 h-7 rounded-md bg-white flex items-center justify-center text-on-surface shadow-sm hover:bg-emerald-50 transition-colors">
                            <span class="material-symbols-outlined text-sm" data-icon="remove">remove</span>
                        </button>
                        <span class="font-bold text-sm w-5 text-center">${item.qty}</span>
                        <button onclick = "manipulate(${index})" class="w-7 h-7 rounded-md bg-white flex items-center justify-center text-on-surface shadow-sm hover:bg-emerald-50 transition-colors">
                            <span onclick class="material-symbols-outlined text-sm" data-icon="add">add</span>
                        </button>
                    </div>
                    <div class="text-right w-24">
                        <p class="font-black text-emerald-800">₦${itemTotal.toLocaleString()}</p>
                    </div>
                    <button onclick="manipulate(${index})" class="text-slate-300 hover:text-error transition-colors">
                        <span class="material-symbols-outlined text-lg" data-icon="close">close</span>
                    </button>
                `;
                    total += itemTotal
                container.appendChild(row);
        });

            total_amount.innerText = `₦${total.toLocaleString()}`
        }
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if(overlay.innerHTML) {
                overlay.innerHTML = "";
            }
        }
    });

    function manipulate(index) {
        const btn = event.currentTarget; // received the action
        const iconSpan = btn.querySelector("span") // span within the button
        const action = iconSpan.dataset.icon;

        if(action === "add") {
            cart[index].qty += 1
        } else if(action === "remove") {
            cart[index].qty -= 1
            if(cart[index].qty === 0) {
                // cart[index].qty = 1
                cart.splice(index, 1)
            }
        } else {
            cart.splice(index, 1)
        }
        renderCart()
    }

    async function submitCart() {
        try {
            const result = await asyncSubmit("/sales", "POST", cart);
            clear_all_items()
            console.log(result)
            showToast(result.status, "success");

        } catch (err) {
            console.log(err)    
            showToast(err.message, "error");
        }
    }

    async function LoadTopProduct() {
        // insert product card in the checkout page
        var topContainer = document.getElementById("displayTop");
        try{
            const result = await asyncGet("/topselling");
            if(result) {
                result.forEach((item, inde) => {
                    var row = document.createElement("div")
                    row.className = "group bg-surface-container-low rounded-2xl p-5 flex flex-col transition-all hover:bg-surface-container-lowest \
                    hover:shadow-xl hover:shadow-slate-200/50 cursor-pointer border border-transparent hover:border-emerald-100/50"

                    row.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                                <span class="px-3 py-1 bg-secondary-container text-on-secondary-container text-[10px] font-bold rounded-full uppercase tracking-tighter">Produce</span>
                        </div>
                        <h3 class="text-lg font-bold text-on-surface mb-1 leading-tight group-hover:text-emerald-900 transition-colors">${item.ProductName}</h3>
                        <div class="mt-auto flex items-center justify-between">
                            <span class="text-xl font-black text-emerald-900">₦${item.Price}</span>
                            <div class="tracker">In Stock(${item.QuantityOnHand})</div>
                        </div>
                `
                    row.addEventListener("click", () => addToCart(item));

                    topContainer.appendChild(row);

                    const tracker = row.querySelector(".tracker");

                    if (item.StockStatus == 1) {
                        tracker.className = "px-2 py-1 bg-primary-fixed text-on-primary-fixed text-[10px] font-black rounded uppercase tracking-tighter";
                    } else if (item.StockStatus == 0) {
                        tracker.className = "px-2 py-1 bg-tertiary-fixed text-on-tertiary-fixed text-[10px] font-black rounded uppercase tracking-tighter";
                    } else {
                        tracker.className = "px-2 py-1 bg-error text-white text-[10px] font-black rounded uppercase tracking-tighter";
                    }
                });
            }
        }catch(err) { console.log(err) }
    }

    document.addEventListener("DOMContentLoaded", LoadTopProduct)
</script>
{{ end }}
