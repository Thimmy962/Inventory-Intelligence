<script>
    async function asyncSubmit(url, met, data = null) {
        const res = await fetch(url, {
            method: met,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        let result = await res.json()
        if (!res.ok) {
            throw new Error(result.error || `HTTP error! status ${res.status}`);
        }
        return result
    }


    async function Login() {
        const username = document.getElementById("username").value
        const password = document.getElementById("password").value
        const data = {
            username: username, password: password
        }
        
        try {
            const res = await asyncSubmit("/login", "POST", data)
        } catch (error) {
            console.log(error)
            showToast(error.message,"error")
            // window.location.replace("/");
        }
    }
        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");

            const toast = document.createElement("div");

            const baseStyles =
                "px-4 py-3 rounded-lg shadow-lg text-white flex items-center justify-between gap-3 min-w-[250px] max-w-[300px] transition-all duration-300 transform translate-y-[-20px] opacity-0";

            const typeStyles = {
                success: "bg-green-600",
                error: "bg-red-600"
            };

            toast.className = `${baseStyles} ${typeStyles[type] || typeStyles.success}`;

            toast.innerHTML = `
                <span>${message}</span>
                <button class="text-white/80 hover:text-white">&times;</button>
            `;

            container.appendChild(toast);

            // Trigger animation (enter)
            requestAnimationFrame(() => {
                toast.classList.remove("translate-y-[-20px]", "opacity-0");
            });

            // Close button
            toast.querySelector("button").addEventListener("click", () => {
                removeToast(toast);
            });

            // Auto remove
            setTimeout(() => {
                removeToast(toast);
            }, 1000);
        }

        function removeToast(toast) {
            toast.classList.add("opacity-0", "translate-y-[-20px]");
            setTimeout(() => toast.remove(), 300);
        }
</script>
